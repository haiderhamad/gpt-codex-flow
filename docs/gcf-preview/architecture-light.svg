<svg id="paused" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">GPT Codex Flow — one project, two coding assistants, clear handoffs</title>
<desc id="desc">ChatGPT and Codex CLI can both code, debug, test, plan and review through their permitted tools. GPT Codex Flow connects approved local project folders using MCP, Task Inbox and Transfer Control. The local Control Center helps the owner choose folders and access. Git changes can be reviewed when a project is a repository. Moving signals illustrate possible handoffs; they do not imply live status, automatic model switching or universal OS sandbox isolation.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eaf4fb"/></linearGradient>
  <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4faff"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 2 6 3-6 3" fill="none" stroke="#3b8eab" stroke-width="1.5"/></marker>
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#213e56}
  .label{font-size:18px;font-weight:750}
  .detail{font-size:12px;fill:#4d6b81}
  .micro{font-size:10.5px;fill:#52758d}
  .signal{fill:none;stroke:#3b8eab;stroke-width:2;stroke-dasharray:5 8;animation:signal 5s linear infinite}
  .packet{opacity:0;animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  .packet rect{fill:#287f91;stroke:#fff;stroke-width:1.5}
  .packet text{fill:#fff;font-size:11px;font-weight:750;text-anchor:middle}
  .outbound{animation-name:outbound}.return{animation-name:return}
  .evidence{animation:evidence 16s ease-in-out infinite}
  @keyframes outbound{0%,4%{opacity:0;transform:translate(165px,158px)}8%{opacity:1;transform:translate(165px,176px)}17%,24%{opacity:1;transform:translate(320px,184px)}34%,40%{opacity:1;transform:translate(475px,158px)}45%,100%{opacity:0;transform:translate(475px,158px)}}
  @keyframes return{0%,54%{opacity:0;transform:translate(475px,158px)}58%{opacity:1;transform:translate(475px,176px)}68%,75%{opacity:1;transform:translate(320px,184px)}85%,91%{opacity:1;transform:translate(165px,158px)}96%,100%{opacity:0;transform:translate(165px,158px)}}
  @keyframes evidence{0%,34%,100%{stroke:#c9deee}44%,88%{stroke:#287f91}}
  .chip-label{font-size:11px;font-weight:700;fill:#255e79}

  @keyframes signal{to{stroke-dashoffset:-130}}

  :root:target *{animation:none!important}:root:target .packet{display:none}
  @media(prefers-reduced-motion:reduce){.signal,.packet,.evidence{animation:none}.packet{display:none}}
</style>
<rect x="1" y="1" width="638" height="458" rx="22" fill="url(#surface)" stroke="#ccdeeb"/>
<text x="28" y="35" font-size="10.4" font-weight="750" letter-spacing="1.4" fill="#52758d">TASKS MOVE. PROJECT CONTEXT STAYS.</text>

<!-- Scoped, reviewable two-way connections; the arrows never imply automatic execution. -->
<g class="signal" marker-start="url(#arrow)" marker-end="url(#arrow)">
 <path d="M165 158V180H320V196"/>
 <path d="M475 158V180H320V196"/>
 <path d="M320 314V355"/>
</g>
<!-- Both connected clients may work on code, subject to separately approved tools. -->
<g fill="#fff" stroke="#c9deee" stroke-width="1.3">
 <rect x="22" y="62" width="280" height="96" rx="16"/>
 <rect x="338" y="62" width="280" height="96" rx="16"/>
</g>
<g fill="none" stroke="#2a7c94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
 <path transform="translate(0 -2.5)" d="M47 88h30v22H61l-8 7v-7h-6z"/>
 <path transform="translate(0 -.5)" d="m370 91-8 9 8 9m14-18 8 9-8 9m-8-24-6 31"/>
</g>
<text class="label" x="91" y="100" dominant-baseline="central">ChatGPT</text>
<text class="detail" x="46" y="136">Code · debug · test · plan · review</text>
<text class="label" x="404" y="100" dominant-baseline="central">Codex CLI</text>
<text class="detail" x="361" y="136">Code · debug · test · plan · review</text>

<!-- Current v1 GCF capabilities, without obsolete Broker/XPC or unattended claims. -->
<rect x="96" y="196" width="448" height="118" rx="17" fill="url(#hub)" stroke="#91bed9" stroke-width="1.6"/>
<g fill="none" stroke="#2583a2" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
 <path d="m124 220-8 8 8 8m17-16 8 8-8 8m-7-23-5 30"/>
</g>
<text class="label" x="166" y="228" dominant-baseline="central">GPT Codex Flow</text>
<g fill="#e5f1f9" stroke="#d0e4f0">
 <rect x="116" y="252" width="98" height="28" rx="13"/>
 <rect x="221" y="252" width="130" height="28" rx="13"/>
 <rect x="358" y="252" width="165" height="28" rx="13"/>
</g>
<text class="chip-label" x="165" y="270" text-anchor="middle">MCP</text>
<text class="chip-label" x="286" y="270" text-anchor="middle">Task Inbox</text>
<text class="chip-label" x="440" y="270" text-anchor="middle">Transfer Control</text>
<path d="m118 292 3 3-3 3m8-6-3 3 3 3" fill="none" stroke="#287f91" stroke-width="1.4"/>
<text class="micro" x="134" y="301">Control Center · project context · Skills</text>
<rect x="206" y="324" width="228" height="23" rx="11.5" fill="#e1eff5"/>
<text x="320" y="339" text-anchor="middle" font-size="10.2" font-weight="700" fill="#41647b">OWNER-SELECTED ACCESS</text>

<!-- Approved Git repositories or ordinary local folders; Git proof where available. -->
<rect class="evidence" x="85" y="355" width="470" height="76" rx="15" fill="#fff" stroke="#c9deee" stroke-width="1.3"/>
<g transform="translate(0 -3)" fill="none" stroke="#2583a2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
 <path d="M118 371v35m0-21 20 12v10"/>
 <circle cx="118" cy="371" r="3" fill="#fff"/>
 <circle cx="118" cy="406" r="3" fill="#fff"/>
 <circle cx="138" cy="407" r="3" fill="#fff"/>
</g>
<text x="156" y="386" dominant-baseline="central" font-size="17" font-weight="750">Approved projects</text>
<text class="detail" x="156" y="412">Git diff + test evidence → review</text>
<text x="320" y="448" class="micro" text-anchor="middle">Illustrative handoff · both directions · no live data</text>
<!-- One task travels through the Inbox, then its result returns. Static labels remain readable. -->
<g class="packet outbound" aria-hidden="true"><rect x="-23" y="-11" width="46" height="22" rx="8"/><text y="4">Task</text></g>
<g class="packet return" aria-hidden="true"><rect x="-25" y="-11" width="50" height="22" rx="8"/><text y="4">Result</text></g>
</svg>
